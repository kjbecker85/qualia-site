<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;color:#fff;font-family:"IBM Plex Sans",sans-serif;
 background:radial-gradient(760px 460px at 92% -8%,rgba(106,72,242,.6),transparent 62%),radial-gradient(560px 380px at -6% 110%,rgba(45,212,191,.2),transparent 60%),linear-gradient(180deg,#0A0920,#110F31)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(169,153,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(169,153,255,.08) 1px,transparent 1px);background-size:56px 56px;
 -webkit-mask-image:radial-gradient(ellipse 80% 90% at 75% 25%,#000 20%,transparent 80%)}
svg.lines{position:absolute;inset:0}
.in{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:flex;align-items:center;gap:18px}
.word{font-family:"Bricolage Grotesque";font-weight:800;font-size:38px;letter-spacing:.2em;background:linear-gradient(95deg,#B5A8FF,#7FA2FF 45%,#2DD4BF);-webkit-background-clip:text;color:transparent;line-height:1}
.sub{font-family:"IBM Plex Mono";font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:#9A96C2;margin-top:8px}
h1{font-family:"Bricolage Grotesque";font-weight:700;font-size:104px;line-height:.96;letter-spacing:-.02em;word-spacing:.06em;max-width:900px}
h1 span{background:linear-gradient(95deg,#B5A8FF,#7FA2FF 45%,#2DD4BF);-webkit-background-clip:text;color:transparent}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:24px;color:#C8C5E6}
.foot b{font-family:"IBM Plex Mono";font-weight:500;font-size:20px;color:#2DD4BF;letter-spacing:.04em}
</style></head>
<body>
<div class="grid"></div>
<svg class="lines" viewBox="0 0 1200 630" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs><linearGradient id="t" x1="0" x2="1"><stop stop-color="#2DD4BF"/><stop offset="1" stop-color="#8E7BFF"/></linearGradient></defs>
  <g stroke="url(#t)" stroke-width="1.5" opacity=".6"><path d="M1200 110H1040l-50 50H900"/><path d="M1200 210H1090l-40 40H960"/><path d="M1200 330H1110l-46-46H990"/><path d="M1200 440H1060l-44 44H930"/></g>
  <g fill="#0A0920" stroke="#2DD4BF" stroke-width="1.6"><circle cx="900" cy="160" r="5"/><circle cx="960" cy="250" r="5"/><circle cx="990" cy="284" r="5"/><circle cx="930" cy="484" r="5"/></g>
</svg>
<div class="in">
  <div class="logo">
    <svg width="72" height="72" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <defs><linearGradient id="g" x1="6" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop stop-color="#B5A8FF"/><stop offset=".55" stop-color="#6F8DFF"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient></defs>
      <path d="M18 44v-6.6C11.5 34.4 7 28.2 7 21 7 11.6 14.6 4 24 4c8.6 0 15.7 6.3 16.8 14.6l3.5 6.8c.4.8-.1 1.8-1 1.9l-2.3.3v5.9c0 2.5-2 4.5-4.5 4.5H33V44" stroke="url(#g)" stroke-width="2.6"/>
      <path d="M15 16h7l4 4h5M14 25h8l4 4h4M24 10.5v5.5" stroke="#2DD4BF" stroke-width="1.8"/>
      <g fill="#2DD4BF"><circle cx="15" cy="16" r="1.9"/><circle cx="31" cy="20" r="1.9"/><circle cx="14" cy="25" r="1.9"/><circle cx="30" cy="29" r="1.9"/><circle cx="24" cy="10" r="1.9"/></g>
    </svg>
    <div><div class="word">QUALIA</div><div class="sub">AI Consulting</div></div>
  </div>
  <h1>Get your people <span>working with AI.</span></h1>
  <div class="foot"><span>AI strategy, team training, custom tools and agents</span><b>engagequalia.com</b></div>
</div>
</body></html>
